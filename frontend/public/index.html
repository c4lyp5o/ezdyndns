<!doctype html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<title>ezdyndns</title>
	<link rel="preload" href="/vendor/fonts/public-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/vendor/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="/app.css">
	<script src="/vendor/htmx.min.js"></script>
</head>
<body>
	<!-- product mark: a home node with two record arcs (the thing ezdyndns keeps linked) -->
	<svg width="0" height="0" class="sr" aria-hidden="true">
		<symbol id="mark" viewBox="0 0 24 24">
			<circle cx="12" cy="12" r="3.2" fill="currentColor"/>
			<path d="M5.5 7.5a8 8 0 0 0 0 9M18.5 7.5a8 8 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
			<path d="M2.5 4.8a12 12 0 0 0 0 14.4M21.5 4.8a12 12 0 0 1 0 14.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
		</symbol>
	</svg>

	<!-- ===== lock screen ===== -->
	<main id="lockscreen">
		<div class="lock-panel">
			<div class="brand"><svg class="mark" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">ezdyndns</span></div>
			<h2 class="lock-title">Unlock the dashboard</h2>
			<p>Enter the management token from <span class="mono">backend/.env</span> (<span class="mono">EZDYNDNS_TOKEN</span>). It is kept for this browser tab only.</p>
			<label class="field"><span>Management token</span>
				<input id="api-token" type="password" autocomplete="current-password">
			</label>
			<div class="lock-row">
				<button class="primary" id="unlock-btn" type="button">Unlock</button>
				<span id="lockstate" role="status" aria-live="polite"></span>
			</div>
		</div>
	</main>

	<!-- ===== dashboard ===== -->
	<div class="gated">
		<header class="topbar">
			<div class="brand"><svg class="mark" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">ezdyndns</span><span class="scope mono" id="scope"></span></div>
			<div class="topbar-actions">
				<button class="primary" id="check-now" type="button" hx-post="/partials/check" hx-target="#hero" hx-disable="this">Check now</button>
				<button class="icon-btn" id="lock-btn" type="button" aria-label="Lock dashboard" title="Lock">
					<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
				</button>
			</div>
		</header>

		<main class="canvas">
			<!--
				Grid: fluid canvas, 32px side padding, 12 columns, one 24px gap.
				At 1440: 1376 = 12 × 92.67 + 11 × 24. Rows: 5+7, 8+4, 12.
			-->
			<div class="title-row">
				<div>
					<h1>Records</h1>
					<p class="finding" id="summary" hx-get="/partials/summary" hx-trigger="load, every 30s, ezdyndns:refresh from:body"></p>
				</div>
				<button class="ghost" type="button" hx-get="/partials/services/new" hx-target="#dialog-body">Add service</button>
			</div>

			<div class="grid">
				<section class="panel span-5" id="hero" aria-label="Public IP"
					hx-get="/partials/hero" hx-trigger="load, every 15s, ezdyndns:refresh from:body"></section>

				<section class="panel span-7 topo" aria-labelledby="topo-title">
					<div class="panel-head">
						<h2 class="panel-title" id="topo-title">Propagation</h2>
						<ul class="legend" aria-label="Legend">
							<li><i class="sw sw-current"></i>Current</li>
							<li><i class="sw sw-pending"></i>Behind</li>
							<li><i class="sw sw-failing"></i>Failing</li>
							<li><i class="sw sw-paused"></i>Paused</li>
						</ul>
					</div>
					<div class="topo-stage" id="topo-stage" aria-hidden="true"></div>
					<div id="topology" hx-get="/partials/topology" hx-trigger="load, every 15s, ezdyndns:refresh from:body"></div>
				</section>

				<section class="panel span-8" aria-labelledby="records-title">
					<div class="panel-head"><h2 class="panel-title" id="records-title">Record health</h2><span class="fresh">newest push on the right</span></div>
					<div id="domains" hx-get="/partials/domains" hx-trigger="load, every 30s, ezdyndns:refresh from:body"></div>
				</section>

				<section class="panel span-4" aria-labelledby="services-title">
					<div class="panel-head"><h2 class="panel-title" id="services-title">Services</h2></div>
					<div id="services" hx-get="/partials/services" hx-trigger="load, every 30s, ezdyndns:refresh from:body"></div>
				</section>

				<section class="panel span-12" id="log" aria-labelledby="log-title">
					<div class="panel-head">
						<h2 class="panel-title" id="log-title">Push log</h2>
						<form id="log-filter" class="log-filter" hx-get="/partials/updates" hx-target="#updates" hx-trigger="change">
							<div class="seg" role="radiogroup" aria-label="Result">
								<label><input type="radio" name="result" value="all" checked><span>All</span></label>
								<label><input type="radio" name="result" value="failed"><span>Failures</span></label>
							</div>
							<label class="sr" for="log-domain">Record</label>
							<select id="log-domain" name="domain_id"><option value="">All records</option></select>
							<input type="hidden" name="limit" id="log-limit" value="50">
						</form>
					</div>
					<div id="updates" hx-get="/partials/updates" hx-include="#log-filter" hx-trigger="load, every 30s, ezdyndns:refresh from:body"></div>
				</section>
			</div>
		</main>
	</div>

	<dialog id="dialog" aria-label="Service">
		<div id="dialog-body"></div>
	</dialog>

	<script src="/app.js"></script>
	<script type="module" src="/ui.js"></script>
</body>
</html>
