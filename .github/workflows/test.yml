name: Test

on:
  push:
    branches: [master, development, "feat/**", "fix/**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test (${{ matrix.bun }})
    runs-on: ubuntu-latest
    # A failure on the newest Bun is a warning, not a blocker for a release.
    continue-on-error: ${{ matrix.bun == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 1.4.4 is the version the Docker image ships; latest catches upcoming breakage.
        bun: ["1.4.4", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: backend
        run: bun test
